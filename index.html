<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="I Do — wedding decoration packages and decor rentals in Sri Lanka." />
  <title>I Do — Wedding Decoration &amp; Event Planning</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
    <header class="nav" id="nav">
  <div class="nav__inner container">

    <a class="brand" href="index.html">
      <svg class="brand__mark" viewBox="0 0 40 24" aria-hidden="true">
        <circle cx="14" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="26" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="brand__name">I&nbsp;Do</span>
    </a>

    <form class="search" role="search" onsubmit="return false;">
      <label class="sr-only" for="site-search">Search packages</label>
      <input id="site-search" type="search" placeholder="Search themes, backdrops, arches…" />
    </form>

    <nav class="nav__links" id="nav-links">
      <a href="index.html" class="is-active">Home</a>
      <a href="#packages">Packages</a>
      <a href="#rentals">Rentals</a>
      <a href="#about">About</a>
    </nav>

    <div class="nav__actions">
      <button class="cart" id="cart-btn" aria-label="Booking list">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h2l2.2 10.2a2 2 0 0 0 2 1.6h7.1a2 2 0 0 0 2-1.5L21 8H7"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10.5" cy="20" r="1.4" fill="currentColor"/>
          <circle cx="18" cy="20" r="1.4" fill="currentColor"/>
        </svg>
        <span class="cart__badge" id="cart-count">0</span>
      </button>
    </div>

  </div>

</html>
